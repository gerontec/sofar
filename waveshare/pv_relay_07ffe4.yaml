# pv_relay: Waveshare ESP32-S3-Relay-6CH (MAC ..07ffe4), relay output for MQTT pv_relay/DOx (2026-10-10).
# Replaces the Sofar/fox2db firmware (sofar_waveshare_07ffe4.yaml). The relays follow the controllers
# (batmonitor 0.46-c sends the DO4 pulse); batmonitor itself runs alongside as a fallback (see below).
#   CH1 (GPIO1)  = DO1  immersion heater stage 1
#   CH2 (GPIO2)  = DO2  immersion heater stage 2
#   CH3 (GPIO41) = DO3  immersion heater stage 3
#   CH4 (GPIO42) = DO4  FoxESS shedding (curtail WR2): batmonitor sends "1", 3 s later "0"
#   CH5, CH6     = unused, always off
# MQTT (broker ${mqtt_broker}):
#   pv_relay/DO1..DO4         command "1" / "0" (not retained)
#   pv_relay/DO1..DO4/state   "1" / "0" (retained)
#   pv_relay/status           online / offline (birth / will, retained)
# Safety: all relays off at boot and when MQTT is lost; DO4 off after DO4_MAX_ON even without "0".
# batmonitor on the ESP (bm_esp.h, 2026-10-11): the C logic of the victron repo unchanged (bm_logic.c bm_step +
#   bm_full_forecast, bm_parse.c), every 5 s like Venus, all inputs from the house broker .218 (inverter, R290, em0,
#   aussen, season, forecast, Pytes ebox/pwr as dbus-ebox-battery; Stack1 MUST and vebus are not on .218).
#   Parameters = /data/batmonitor/env on Venus (substitution bm_params), at runtime batmonitor_esp/cfg (retained,
#   "NAME=value ..."). Results: batmonitor_esp/state, batmonitor_esp/peak_model, batmonitor_esp/params.
#   Setpoints are only published (no second controller on the Multis). DO4: the ESP pulses its own relay when
#   bm_step says so and batmonitor is silent (batmonitor/peak_model older than 180 s), then batmonitor/do4_last.
#   RS485 (GPIO17/18, DE GPIO3) unused.

substitutions:
  device_name: pv-relay-07ffe4
  mac_suffix: "07ffe4"
  mqtt_broker: 192.168.178.218
  wifi_ssid: f24
  wifi_password: "9876543210"
  ota_password: waveshare2026
  do4_max_on: 10s
  bm_params: "CHARGE_EFF=0.90 SOC_MIN=8 SOC_MIN_RELEASE=10"   # /data/batmonitor/env on Venus (2026-10-11)

esphome:
  name: ${device_name}
  friendly_name: PV relay 07ffe4
  includes:
    - ../../victron/venus-addons/batmonitor/c/bm_logic.h
    - ../../victron/venus-addons/batmonitor/c/bm_logic.c
    - ../../victron/venus-addons/batmonitor/c/bm_parse.c
    - bm_esp.h
  includes_c:
    - ../../victron/venus-addons/batmonitor/c/bm_parse.h
  platformio_options:
    build_flags:
      - -I/home/gh/python/waveshare/bm_esp_inc     # <cjson/cJSON.h> of bm_parse.c -> ESP-IDF json component
  on_boot:
    priority: 600
    then:
      - lambda: 'bmesp::set_params("${bm_params}");'

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino
    advanced:
      include_builtin_idf_components: [json]   # cJSON for bm_parse.c / bm_esp.h

network:
  enable_ipv6: true

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG     # logs over the USB port: esphome logs pv_relay_07ffe4.yaml --device /dev/ttyACM0

ota:
  - platform: esphome
    password: ${ota_password}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  reboot_timeout: 5min
  ap:
    ssid: Sofar-Waveshare-AP
    password: ${ota_password}

time:
  - platform: sntp
    id: sntp_time
    timezone: "CET-1CEST,M3.5.0,M10.5.0/3"

switch:
  - platform: gpio
    id: do1
    name: DO1 heater 1
    pin: GPIO1
    restore_mode: ALWAYS_OFF
    on_turn_on:  [mqtt.publish: {topic: pv_relay/DO1/state, payload: "1", retain: true}]
    on_turn_off: [mqtt.publish: {topic: pv_relay/DO1/state, payload: "0", retain: true}]
  - platform: gpio
    id: do2
    name: DO2 heater 2
    pin: GPIO2
    restore_mode: ALWAYS_OFF
    on_turn_on:  [mqtt.publish: {topic: pv_relay/DO2/state, payload: "1", retain: true}]
    on_turn_off: [mqtt.publish: {topic: pv_relay/DO2/state, payload: "0", retain: true}]
  - platform: gpio
    id: do3
    name: DO3 heater 3
    pin: GPIO41
    restore_mode: ALWAYS_OFF
    on_turn_on:  [mqtt.publish: {topic: pv_relay/DO3/state, payload: "1", retain: true}]
    on_turn_off: [mqtt.publish: {topic: pv_relay/DO3/state, payload: "0", retain: true}]
  - platform: gpio
    id: do4
    name: DO4 FoxESS shedding
    pin: GPIO42
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - mqtt.publish: {topic: pv_relay/DO4/state, payload: "1", retain: true}
      - script.execute: do4_guard
    on_turn_off:
      - script.stop: do4_guard
      - mqtt.publish: {topic: pv_relay/DO4/state, payload: "0", retain: true}
  - { platform: gpio, id: ch5, name: CH5 unused, pin: GPIO45, restore_mode: ALWAYS_OFF, internal: true }
  - { platform: gpio, id: ch6, name: CH6 unused, pin: GPIO46, restore_mode: ALWAYS_OFF, internal: true }

script:
  # DO4 never stays on: off after do4_max_on even if the "0" is lost
  - id: do4_guard
    mode: restart
    then:
      - delay: ${do4_max_on}
      - logger.log: {format: "DO4 guard: off after max on time", level: WARN}
      - switch.turn_off: do4
  # local DO4 pulse (batmonitor silent): DO4_PULSE_S = 3 s as batmonitor, then tell r290_boost / hantech
  - id: do4_local_pulse
    mode: single
    then:
      - logger.log: {format: "DO4 local pulse: batmonitor silent, PCC above 20 kW", level: WARN}
      - mqtt.publish: {topic: batmonitor/do4_last, payload: !lambda 'return bmesp::do4_last_json();', retain: true}
      - switch.turn_on: do4
      - delay: 3s
      - switch.turn_off: do4
  - id: all_off
    then:
      - switch.turn_off: do1
      - switch.turn_off: do2
      - switch.turn_off: do3
      - switch.turn_off: do4

mqtt:
  id: mqtt_client
  broker: ${mqtt_broker}
  port: 1883
  client_id: pv_relay_${mac_suffix}
  keepalive: 30s
  reboot_timeout: 15min
  discovery: false
  birth_message: {topic: pv_relay/status, payload: online, retain: true}
  will_message: {topic: pv_relay/status, payload: offline, retain: true}
  on_connect:
    then:                              # report the relay states after (re)connect; the client only publishes a
      - delay: 2s                      # moment after the trigger
      - lambda: |-
          const char *t[4] = {"pv_relay/DO1/state", "pv_relay/DO2/state", "pv_relay/DO3/state", "pv_relay/DO4/state"};
          bool v[4] = {id(do1).state, id(do2).state, id(do3).state, id(do4).state};
          for (int i = 0; i < 4; i++)
            id(mqtt_client).publish(t[i], v[i] ? "1" : "0", 1, 0, true);
          id(mqtt_client).publish("batmonitor_esp/params", bmesp::params_json(), 1, true);
  on_disconnect:
    then:
      - script.execute: all_off
  on_message:
    - topic: pv_relay/DO1
      then:
        - lambda: 'if (x == "1") id(do1).turn_on(); else if (x == "0") id(do1).turn_off();'
    - topic: pv_relay/DO2
      then:
        - lambda: 'if (x == "1") id(do2).turn_on(); else if (x == "0") id(do2).turn_off();'
    - topic: pv_relay/DO3
      then:
        - lambda: 'if (x == "1") id(do3).turn_on(); else if (x == "0") id(do3).turn_off();'
    - topic: pv_relay/DO4
      then:
        - lambda: |-
            bmesp::on_do4_cmd(x);
            if (x == "1") id(do4).turn_on(); else if (x == "0") id(do4).turn_off();
    # batmonitor inputs from .218 (as batmonitor.c on Venus)
    - topic: inverter/power_grid_exchange/json
      then: [lambda: 'bmesp::on_inverter(x);']
    - topic: r290/heatpump/all
      then: [lambda: 'bmesp::on_r290(x);']
    - topic: em0/power
      then: [lambda: 'bmesp::on_wp(x);']
    - topic: aussen/temp
      then: [lambda: 'bmesp::on_aussen(x);']
    - topic: batmonitor/season
      then: [lambda: 'bmesp::on_season(x);']
    - topic: batmonitor/forecast
      then: [lambda: 'bmesp::on_forecast(x);']
    - topic: ebox/pwr
      then: [lambda: 'bmesp::on_ebox(x);']
    - topic: batmonitor/peak_model
      then: [lambda: 'bmesp::on_bm_peak(x);']
    - topic: batmonitor_esp/cfg
      then:
        - lambda: |-
            bmesp::set_params(x);
            id(mqtt_client).publish("batmonitor_esp/params", bmesp::params_json(), 1, true);

interval:
  # one batmonitor cycle every CYCLE_SECONDS (5 s), once SNTP has the wall clock
  - interval: 5s
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid())
            return;
          if (bmesp::cycle(now.timestamp) && id(mqtt_client).is_connected())
            id(do4_local_pulse).execute();
          std::string s = bmesp::state_json();
          if (!s.empty())
            id(mqtt_client).publish("batmonitor_esp/state", s, 0, true);
  - interval: 60s
    then:
      - lambda: |-
          std::string s = bmesp::peak_model_json();
          if (!s.empty())
            id(mqtt_client).publish("batmonitor_esp/peak_model", s, 1, true);
